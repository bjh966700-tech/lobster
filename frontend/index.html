<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>랍스터 — AI 대화 공유 카드</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <header class="top">
    <a href="./" class="brand">🦞 랍스터</a>
    <span class="tagline">AI 대화를 맥락째로 넘겨주세요</span>
  </header>

  <main>
    <!-- 카드 작성 -->
    <section id="create-view" hidden>
      <h1>AI 대화 카드 만들기</h1>
      <p class="sub">카톡에 답변만 복붙하지 말고, 무엇을 물어봤는지까지 같이 공유하세요.</p>

      <form id="card-form" novalidate>
        <label>제목 <span class="opt">(비우면 프롬프트 첫 줄)</span>
          <input name="title" maxlength="120" placeholder="예: DynamoDB 테이블 설계 질문" />
        </label>

        <div class="row">
          <label>사용한 AI
            <select name="aiTool">
              <option>ChatGPT</option><option>Claude</option><option>Gemini</option>
              <option>Kiro</option><option>Copilot</option><option>기타</option>
            </select>
          </label>
          <label>작성자 <span class="opt">(선택)</span>
            <input name="author" maxlength="40" placeholder="예: 재엽" />
          </label>
        </div>

        <label>내가 쓴 프롬프트 <span class="req">*</span>
          <textarea name="prompt" rows="6" maxlength="30000" placeholder="AI에게 보낸 질문을 그대로 붙여넣으세요"></textarea>
        </label>

        <label>AI 답변 <span class="req">*</span>
          <textarea name="answer" rows="10" maxlength="60000" placeholder="AI의 답변을 붙여넣으세요 (마크다운 그대로 OK)"></textarea>
        </label>

        <label>메모 — 왜 물어봤는지 / 팀원에게 할 말 <span class="opt">(선택)</span>
          <textarea name="memo" rows="3" maxlength="2000" placeholder="예: 우리 카드 저장 구조 정하려고 물어봄. 2번 방식이 괜찮아 보이는데 의견 줘!"></textarea>
        </label>

        <p id="form-error" class="error" role="alert" hidden></p>
        <button type="submit" id="submit-btn" class="primary">카드 만들고 공유 링크 받기</button>
      </form>

      <div id="created" class="created" hidden>
        <h2>✅ 카드가 만들어졌어요</h2>
        <p>이 링크 하나만 팀 채팅에 보내면 돼요.</p>
        <div class="link-row">
          <input id="share-url" readonly />
          <button id="copy-link" class="primary">링크 복사</button>
        </div>
        <p class="actions">
          <a id="open-card" href="#">카드 보러 가기 →</a>
          <button id="new-card" class="ghost">새 카드 만들기</button>
        </p>
      </div>
    </section>

    <!-- 카드 보기 -->
    <section id="card-view" hidden>
      <p id="card-loading" class="muted">카드를 불러오는 중…</p>
      <p id="card-error" class="error" hidden></p>

      <article id="card" hidden>
        <div class="meta">
          <span id="c-ai" class="badge"></span>
          <span id="c-author"></span>
          <span id="c-date" class="muted"></span>
        </div>
        <h1 id="c-title"></h1>

        <div id="c-memo-box" class="memo" hidden>
          <div class="label">💬 메모</div>
          <div id="c-memo"></div>
        </div>

        <div class="block prompt">
          <div class="label">🙋 이렇게 물어봤어요 (프롬프트)</div>
          <div id="c-prompt" class="md"></div>
        </div>

        <div class="block answer">
          <div class="label">🤖 AI가 이렇게 답했어요</div>
          <div id="c-answer" class="md"></div>
        </div>

        <div class="handoff">
          <h2>내 AI로 이어서 물어보기</h2>
          <label>추가로 물어볼 질문 <span class="opt">(선택)</span>
            <textarea id="followup" rows="2" placeholder="예: 이 설계에서 공유 링크 만료 기능을 추가하려면?"></textarea>
          </label>
          <div class="btns">
            <button id="copy-ai" class="primary">📋 AI용으로 복사</button>
            <button id="open-chatgpt">ChatGPT로 열기</button>
            <button id="open-claude">Claude로 열기</button>
            <button id="copy-link2" class="ghost">🔗 이 카드 링크 복사</button>
          </div>
          <p id="handoff-msg" class="note" hidden></p>
        </div>
      </article>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
